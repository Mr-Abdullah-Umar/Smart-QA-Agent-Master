[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-engine"
version = "0.5.0"
description = "Advanced AI QA Testing Harness Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "playwright>=1.44.0",
    "pytest>=8.2.0",
    "pytest-playwright>=0.5.0",
    "pytest-asyncio>=0.23.0",
    "jinja2>=3.1.4",
    "defusedxml>=0.7.1",
]

[project.scripts]
qa-harness = "qa_engine.cli:main"

[tool.setuptools.packages.find]
include = ["qa_engine*"]

[tool.setuptools.package-data]
qa_engine = ["reporting/templates/*.jinja2"]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "C4",  # flake8-comprehensions
]
ignore = [
    "S101", # allow assert in pytest suites
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"] # allow asserts in test suites

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

